<!DOCTYPE html>
<html>

<head>
<title>Set PIN - LinkVault</title>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="box">

        <h1>🔐 LinkVault</h1>

        <h2>Create 4-Digit PIN</h2>

        <input type="password" id="pin" maxlength="4" placeholder="Enter 4 digit PIN">


        <input type="password" id="confirmPin" maxlength="4" placeholder="Confirm PIN">


        <button onclick="setPin()">
            Save PIN
        </button>

    </div>


    <script type="module" src="auth.js"></script>

</body>

</html>
