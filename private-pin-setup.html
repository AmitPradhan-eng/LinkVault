<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b1020"
    >

    <title>Private PIN • LinkVault</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(59, 130, 246, .22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(139, 92, 246, .22),
                    transparent 35%
                ),
                #070b16;
        }

        .box {

            width: 100%;
            max-width: 420px;

            padding: 38px 30px;

            text-align: center;

            border-radius: 28px;

            background:
                rgba(17, 24, 39, .75);

            border:
                1px solid
                rgba(255, 255, 255, .10);

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, .45);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);
        }

        .icon {

            width: 78px;
            height: 78px;

            margin:
                0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 23px;

            font-size: 36px;

            background:
                linear-gradient(
                    135deg,
                    rgba(59, 130, 246, .22),
                    rgba(139, 92, 246, .22)
                );

            border:
                1px solid
                rgba(255, 255, 255, .12);
        }

        h1 {

            font-size: 26px;

            margin-bottom: 8px;
        }

        .subtitle {

            color:
                rgba(255, 255, 255, .55);

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 26px;
        }

        input {

            width: 100%;

            height: 56px;

            margin-bottom: 14px;

            padding: 0 18px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255, 255, 255, .12);

            outline: none;

            background:
                rgba(255, 255, 255, .055);

            color: white;

            text-align: center;

            font-size: 22px;

            letter-spacing: 8px;
        }

        input:focus {

            border-color:
                rgba(96, 165, 250, .75);

            box-shadow:
                0 0 0 4px
                rgba(59, 130, 246, .10);
        }

        button {

            width: 100%;

            height: 55px;

            margin-top: 8px;

            border: none;

            border-radius: 16px;

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6,
                    #7c3aed
                );

            box-shadow:
                0 12px 30px
                rgba(59, 130, 246, .25);
        }

        button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        .message {

            margin-top: 16px;

            font-size: 13px;

            display: none;
        }

        .error {

            color: #fca5a5;
        }

        .success {

            color: #86efac;
        }

        .back {

            margin-top: 18px;

            background: transparent;

            box-shadow: none;

            color:
                rgba(255, 255, 255, .5);
        }

    </style>

</head>


<body>

    <div class="box">

        <div class="icon">
            🔐
        </div>

        <h1>
            Private Space PIN
        </h1>

        <p class="subtitle">

            Create a separate 4-digit PIN
            for your Private Space.

            <br><br>

            This PIN is completely independent
            from your LinkVault login PIN.

        </p>


        <input
            type="password"
            id="privatePin"
            maxlength="4"
            inputmode="numeric"
            autocomplete="new-password"
            placeholder="••••"
        >


        <input
            type="password"
            id="confirmPrivatePin"
            maxlength="4"
            inputmode="numeric"
            autocomplete="new-password"
            placeholder="Confirm PIN"
        >


        <button id="saveBtn">

            🔒 Save Private PIN

        </button>


        <div
            id="message"
            class="message"
        ></div>


        <button
            id="backBtn"
            class="back"
        >

            ← Back

        </button>

    </div>


    <script type="module">

        import {
            onAuthStateChanged
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


        import {
            doc,
            getDoc,
            setDoc
        }
        from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        import {
            auth,
            db
        }
        from "./firebase.js";


        const privatePin =
            document.getElementById(
                "privatePin"
            );


        const confirmPrivatePin =
            document.getElementById(
                "confirmPrivatePin"
            );


        const saveBtn =
            document.getElementById(
                "saveBtn"
            );


        const message =
            document.getElementById(
                "message"
            );


        const backBtn =
            document.getElementById(
                "backBtn"
            );


        let currentUser = null;


        /* =========================================
           ONLY NUMBERS
        ========================================= */

        function numericOnly(input) {

            input.value =
                input.value
                    .replace(/\D/g, "")
                    .slice(0, 4);

        }


        privatePin.addEventListener(
            "input",
            () => {

                numericOnly(
                    privatePin
                );

            }
        );


        confirmPrivatePin.addEventListener(
            "input",
            () => {

                numericOnly(
                    confirmPrivatePin
                );

            }
        );


        /* =========================================
           AUTH
        ========================================= */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {

                    alert(
                        "Please login to LinkVault first."
                    );

                    window.location.href =
                        "index.html";

                    return;

                }


                currentUser =
                    user;


                console.log(
                    "✅ Authenticated:",
                    user.uid
                );


                /* Check existing Private PIN */

                try {

                    const userRef =
                        doc(
                            db,
                            "users",
                            user.uid
                        );


                    const userSnap =
                        await getDoc(
                            userRef
                        );


                    if (
                        userSnap.exists() &&
                        userSnap.data().privatePin
                    ) {

                        console.log(
                            "ℹ️ Private PIN already exists"
                        );

                    }

                }

                catch (error) {

                    console.error(
                        "Error checking Private PIN:",
                        error
                    );

                }

            }
        );


        /* =========================================
           SAVE PRIVATE PIN
        ========================================= */

        saveBtn.addEventListener(
            "click",
            async () => {

                const pin =
                    privatePin.value.trim();


                const confirmPin =
                    confirmPrivatePin.value.trim();


                /* Validate */

                if (
                    !/^\d{4}$/.test(pin)
                ) {

                    showMessage(
                        "❌ Enter exactly 4 digits.",
                        "error"
                    );

                    return;

                }


                if (
                    !/^\d{4}$/.test(confirmPin)
                ) {

                    showMessage(
                        "❌ Confirm your 4-digit PIN.",
                        "error"
                    );

                    return;

                }


                if (
                    pin !== confirmPin
                ) {

                    showMessage(
                        "❌ PINs do not match.",
                        "error"
                    );

                    return;

                }


                if (!currentUser) {

                    showMessage(
                        "❌ Please login first.",
                        "error"
                    );

                    return;

                }


                try {

                    saveBtn.disabled =
                        true;

                    saveBtn.textContent =
                        "🔐 Saving...";


                    const userRef =
                        doc(
                            db,
                            "users",
                            currentUser.uid
                        );


                    /*
                     * IMPORTANT
                     *
                     * setDoc(..., { merge: true })
                     * updates ONLY privatePin.
                     *
                     * Existing fields such as:
                     *
                     * userPin
                     * links
                     * privateLinks
                     *
                     * remain untouched.
                     */

                    await setDoc(
                        userRef,
                        {
                            privatePin: pin
                        },
                        {
                            merge: true
                        }
                    );


                    console.log(
                        "✅ Private PIN saved to Firebase"
                    );


                    showMessage(
                        "✅ Private PIN created successfully!",
                        "success"
                    );


                    saveBtn.textContent =
                        "✅ Saved";


                    setTimeout(
                        () => {

                            window.location.href =
                                "private-pin.html";

                        },
                        900
                    );

                }

                catch (error) {

                    console.error(
                        "❌ Failed to save Private PIN:",
                        error
                    );


                    showMessage(
                        "❌ Failed to save PIN. Please try again.",
                        "error"
                    );


                    saveBtn.disabled =
                        false;

                    saveBtn.textContent =
                        "🔒 Save Private PIN";

                }

            }
        );


        /* =========================================
           MESSAGE
        ========================================= */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

            message.style.display =
                "block";

        }


        /* =========================================
           BACK
        ========================================= */

        backBtn.addEventListener(
            "click",
            () => {

                window.location.href =
                    "index.html";

            }
        );


    </script>

</body>

</html>
